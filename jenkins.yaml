# Jenkins Configuration as Code (JCasC)
# Place this file in ~/.jenkins/jenkins.yaml and enable JCasC plugin

jenkins:
  systemMessage: "Welcome to Automation Engineer Prep CI/CD Pipeline"
  numExecutors: 4
  remotingSecurity:
    enabled: true
  
  securityRealm:
    local:
      allowsSignup: false
      enableCaptchaOnSignup: false
  
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            permissions:
              - "hudson.model.Hudson.Administer"
              - "hudson.model.Hudson.Read"
              - "hudson.model.Hudson.RunScripts"
          - name: "developer"
            permissions:
              - "hudson.model.Hudson.Read"
              - "hudson.model.Item.Build"
              - "hudson.model.Item.Cancel"
              - "hudson.model.Item.Read"
              - "hudson.model.Item.Workspace"
              - "hudson.model.Run.Delete"
              - "hudson.model.Run.Update"
          - name: "viewer"
            permissions:
              - "hudson.model.Hudson.Read"
              - "hudson.model.Item.Read"
  
  crumbIssuer:
    standard:
      excludeClientIPFromCrumb: true
  
  views:
    - all:
        name: "All"
    - list:
        name: "Automation Tests"
        description: "All automation test pipelines"
        includeRegex: "^.*Automation.*"
  
  # Global environment variables
  globalNodeProperties:
    - envVars:
        env:
          - key: "JAVA_VERSION"
            value: "11"
          - key: "MAVEN_VERSION"
            value: "3.8.1"
          - key: "WORKSPACE_ROOT"
            value: "/var/jenkins_home"

security:
  apiToken:
    creationOfLegacyTokenEnabled: false

unclassified:
  # Git configuration
  gitSCM:
    createAccountBasedOnEmail: false
    disableDefaults: false
    ignoreNotifyCommit: false
    useExistingAccountWithSameEmail: false
  
  # Email configuration
  mailer:
    smtpHost: "smtp.gmail.com"
    smtpPort: 587
    useSMTPAuth: true
    smtpAuthUsername: "${EMAIL_USERNAME}"
    smtpAuthPassword: "${EMAIL_PASSWORD}"
    replyToAddress: "${REPLY_TO_ADDRESS}"
    smtpHostname: "smtp.gmail.com"
    charset: "UTF-8"
  
  # GitHub configuration
  github:
    apiUrl: "https://api.github.com"
  
  # Location configuration
  location:
    url: "http://localhost:8080/"
  
  # Timestamper format
  timestamper:
    allPipelines: true
    elapsedTimeFormat: "'[' HH:mm:ss.S ']' "
    systemTimeFormat: "'[' yyyy-MM-dd HH:mm:ss ']' "

# Credentials configuration
credentials:
  system:
    domainCredentials:
      - credentials:
          - basic:
              scope: GLOBAL
              id: "github-credentials"
              username: "${GITHUB_USERNAME}"
              password: "${GITHUB_TOKEN}"
              description: "GitHub Personal Access Token"
          - basic:
              scope: GLOBAL
              id: "maven-credentials"
              username: "${MAVEN_USERNAME}"
              password: "${MAVEN_PASSWORD}"
              description: "Maven Repository Credentials"

# Tool locations
tool:
  git:
    installations:
      - name: "Default"
        home: "git"
  maven:
    installations:
      - name: "Maven3.8.1"
        properties:
          - installSource:
              direct:
                url: "https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.zip"
  jdk:
    installations:
      - name: "Java11"
        properties:
          - installSource:
              adoptOpenJdk:
                id: "jdk-11.0.1+13"
